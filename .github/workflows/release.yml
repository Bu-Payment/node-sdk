name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        with:
          tool: git-cliff
          fallback: none

      - name: Verify tag matches the version computed from commits
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag -d "${TAG_NAME}" >/dev/null
          trap 'git tag "${TAG_NAME}" "${GITHUB_SHA}"' EXIT

          PREVIOUS="$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' HEAD 2>/dev/null || true)"
          if [ -z "${PREVIOUS}" ]; then
            echo "No stable tag reachable from ${GITHUB_SHA}; skipping the bump check for the first release of this line."
            exit 0
          fi

          EXPECTED="$(git-cliff --config cliff.toml --use-branch-tags --ignore-tags '.*-.*' --bumped-version)"
          EXPECTED="v${EXPECTED#v}"

          TAG_MAJOR="${TAG_NAME#v}"
          TAG_MAJOR="${TAG_MAJOR%%.*}"
          EXPECTED_MAJOR="${EXPECTED#v}"
          EXPECTED_MAJOR="${EXPECTED_MAJOR%%.*}"
          MAINTENANCE_BRANCH="origin/${TAG_MAJOR}.x"
          DEFAULT_BRANCH="$(git remote show origin | sed -n 's/.*HEAD branch: //p')"
          if [ "${EXPECTED_MAJOR}" -gt "${TAG_MAJOR}" ] \
            && git rev-parse --verify --quiet "refs/remotes/${MAINTENANCE_BRANCH}" >/dev/null \
            && git merge-base --is-ancestor "${GITHUB_SHA}" "${MAINTENANCE_BRANCH}" \
            && ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/${DEFAULT_BRANCH}"; then
            EXPECTED="v$(git-cliff --config cliff.toml --use-branch-tags --ignore-tags '.*-.*' --bump minor --bumped-version | sed 's/^v//')"
            echo "::warning::${MAINTENANCE_BRANCH#origin/} carries breaking changes since ${PREVIOUS:-the last release}. A maintenance line cannot move to the next major, so the release is checked as ${EXPECTED}; document the break in the upgrade guide."
          fi

          if [ -n "${PREVIOUS}" ] && [ "${EXPECTED}" = "${PREVIOUS}" ]; then
            IFS=. read -r MAJOR MINOR PATCH <<< "${PREVIOUS#v}"
            EXPECTED="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          if [ "${EXPECTED}" != "${TAG_NAME}" ]; then
            echo "::error::Tag ${TAG_NAME} does not match the version computed from the commits since ${PREVIOUS:-the last release} (${EXPECTED}). Delete the tag, re-tag as ${EXPECTED}, and push again: git tag -d ${TAG_NAME} && git push origin :refs/tags/${TAG_NAME} && git tag ${EXPECTED} && git push --follow-tags"
            exit 1
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Verify the tagged commit builds and passes its tests
        run: |
          bun install --frozen-lockfile
          bun run check

      - name: Generate CHANGELOG
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: git-cliff --config cliff.toml --use-branch-tags --tag "${TAG_NAME}" --output CHANGELOG.md

      - name: Extract release notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git-cliff --config cliff.toml --use-branch-tags --current --strip all > "${RUNNER_TEMP}/release-notes.md"
          if ! grep -q '[^[:space:]]' "${RUNNER_TEMP}/release-notes.md"; then
            echo "Maintenance release with no user-facing changes." > "${RUNNER_TEMP}/release-notes.md"
          fi

      - name: Resolve release branch
        id: branch
        run: |
          set -euo pipefail
          DEFAULT_BRANCH="$(git remote show origin | sed -n 's/.*HEAD branch: //p')"
          MAJOR="${TAG_NAME#v}"
          MAJOR="${MAJOR%%.*}"

          BRANCH=""
          for CANDIDATE in "${MAJOR}.x" "${DEFAULT_BRANCH}"; do
            if git rev-parse --verify --quiet "refs/remotes/origin/${CANDIDATE}" >/dev/null \
              && git merge-base --is-ancestor "${GITHUB_SHA}" "origin/${CANDIDATE}"; then
              BRANCH="${CANDIDATE}"
              break
            fi
          done

          if [ -z "${BRANCH}" ]; then
            echo "::error::${TAG_NAME} is not contained in ${MAJOR}.x or ${DEFAULT_BRANCH}; refusing to publish it."
            exit 1
          fi

          is_newest_on() {
            local HIGHEST
            HIGHEST="$( { git tag --merged "origin/$1" --list 'v[0-9]*' | grep -v -- '-' || true; echo "${TAG_NAME}"; } | sort -V | tail -n1)"
            [ "${HIGHEST}" = "${TAG_NAME}" ]
          }

          NEWEST=false
          PRERELEASE=false
          LATEST=false
          case "${TAG_NAME}" in
            *-*) PRERELEASE=true ;;
            *)
              if is_newest_on "${BRANCH}"; then
                NEWEST=true
              fi
              if git merge-base --is-ancestor "${GITHUB_SHA}" "origin/${DEFAULT_BRANCH}" && is_newest_on "${DEFAULT_BRANCH}"; then
                LATEST=true
              fi
              ;;
          esac

          echo "Release branch: ${BRANCH} (default ${DEFAULT_BRANCH}); newest on branch: ${NEWEST}; latest: ${LATEST}; prerelease: ${PRERELEASE}"
          {
            echo "name=${BRANCH}"
            echo "newest=${NEWEST}"
            echo "latest=${LATEST}"
            echo "prerelease=${PRERELEASE}"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.branch.outputs.latest }}
          PRERELEASE: ${{ steps.branch.outputs.prerelease }}
        run: |
          gh release delete "${TAG_NAME}" --yes 2>/dev/null || true
          gh release create "${TAG_NAME}" \
            --title "${TAG_NAME}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --latest="${LATEST}" \
            --prerelease="${PRERELEASE}"

      - name: Commit CHANGELOG and package.json version
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          NEWEST: ${{ steps.branch.outputs.newest }}
        run: |
          set -euo pipefail
          if [ "${NEWEST}" != true ]; then
            echo "::notice::${TAG_NAME} is not the newest stable release on ${BRANCH}; CHANGELOG.md and package.json on ${BRANCH} are left as is."
            exit 0
          fi

          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          mv CHANGELOG.md "${RUNNER_TEMP}/CHANGELOG.md"

          for ATTEMPT in 1 2 3; do
            git fetch --quiet origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
            git checkout -f -B "${BRANCH}" "origin/${BRANCH}"
            cp "${RUNNER_TEMP}/CHANGELOG.md" CHANGELOG.md
            VERSION="${TAG_NAME#v}" node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.env.VERSION;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
            git add CHANGELOG.md package.json

            if git diff --cached --quiet; then
              echo "::notice::${BRANCH} already carries the CHANGELOG and version for ${TAG_NAME}."
              exit 0
            fi

            git commit --quiet -m "chore(release): ${TAG_NAME}"

            if git push origin "HEAD:refs/heads/${BRANCH}"; then
              exit 0
            fi

            echo "::warning::${BRANCH} moved while ${TAG_NAME} was being published; retrying (attempt ${ATTEMPT})."
          done

          echo "::error::Could not push the release commit to ${BRANCH} after 3 attempts. ${TAG_NAME} is published; re-run this job to land CHANGELOG.md and the package.json version."
          exit 1
